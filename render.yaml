services:
  - type: web
    name: blogverse-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_URL
        value: https://blogverse-frontend.onrender.com
      - key: COOKIE_SAME_SITE
        value: lax

staticSites:
  - name: blogverse-frontend
    buildCommand: echo "BlogVerse static frontend ready"
    staticPublishPath: .
