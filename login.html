<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - BlogVerse</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="navbar-brand">
        <div class="logo-icon">✍</div>
        BlogVerse
      </a>

      <button class="hamburger" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <div class="nav-menu">
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="index.html#featured">Blog</a>
          <a href="index.html#categories">Categories</a>
        </div>
        <div class="nav-auth">
          <a href="login.html" class="btn btn-sm btn-secondary active">Log In</a>
          <a href="register.html" class="btn btn-sm btn-primary">Sign Up</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Login Form -->
  <div class="auth-wrapper">
    <div class="auth-card fade-in-up">
      <div class="logo">
        <h2>Welcome Back 👋</h2>
        <p>Log in to your BlogVerse account</p>
      </div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required>
        </div>

        <div class="form-options">
          <label>
            <input type="checkbox" checked> Remember me
          </label>
          <a href="#">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-lg">Log In</button>
      </form>

      <div class="divider">or continue with</div>

      <div class="social-btns">
        <button class="btn">🔵 Google</button>
        <button class="btn">⚫ GitHub</button>
      </div>

      <p class="auth-footer">
        Don't have an account? <a href="register.html">Sign up for free</a>
      </p>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    const form = document.getElementById('loginForm');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      let valid = true;

      const email = document.getElementById('email');
      const password = document.getElementById('password');

      // Clear previous errors
      clearFieldError(email);
      clearFieldError(password);

      // Validate email
      if (!email.value.trim()) {
        showFieldError(email, 'Email is required');
        valid = false;
      } else if (!validateEmail(email.value)) {
        showFieldError(email, 'Please enter a valid email');
        valid = false;
      }

      // Validate password
      if (!password.value) {
        showFieldError(password, 'Password is required');
        valid = false;
      }

      if (!valid) return;

      // Check credentials
      const user = DB.findUser(email.value);
      if (!user || user.password !== password.value) {
        showToast('Invalid email or password', 'error');
        return;
      }

      // Login success
      DB.setCurrentUser(user);
      showToast('Welcome back, ' + user.name + '!', 'success');

      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 1000);
    });

    // Clear errors on input
    document.querySelectorAll('input').forEach(input => {
      input.addEventListener('input', () => clearFieldError(input));
    });
  </script>
</body>
</html>
