<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Blog - BlogVerse</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="navbar-brand">
        <div class="logo-icon">✍</div>
        BlogVerse
      </a>

      <button class="hamburger" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <div class="nav-menu">
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="dashboard.html">Dashboard</a>
          <a href="create-blog.html" class="active">Create Post</a>
        </div>
        <div class="nav-auth">
          <!-- Updated by JS -->
        </div>
      </div>
    </div>
  </nav>

  <!-- Create Blog Form -->
  <div class="create-blog-wrapper">
    <div class="create-blog-card fade-in-up">
      <h2>✏️ Create New Post</h2>

      <form id="createBlogForm" novalidate>
        <div class="form-group">
          <label for="title">Post Title</label>
          <input type="text" id="title" placeholder="Enter an engaging title..." required>
        </div>

        <div class="form-group">
          <label>Cover Image</label>
          <div class="image-upload" id="imageUpload">
            <div class="upload-icon">📷</div>
            <p><strong>Click to upload</strong> or drag and drop</p>
            <p style="font-size: 0.85rem; margin-top: 5px;">SVG, PNG, JPG or GIF (max. 2MB)</p>
          </div>
          <input type="file" id="coverImage" accept="image/*" style="display: none;">
        </div>

        <div class="form-group">
          <label for="category">Category</label>
          <select id="category">
            <option value="">Select a category</option>
            <option value="Technology">Technology</option>
            <option value="Design">Design</option>
            <option value="Tutorial">Tutorial</option>
            <option value="Startup">Startup</option>
            <option value="AI & ML">AI & ML</option>
            <option value="Lifestyle">Lifestyle</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="content">Content</label>
          <textarea id="content" placeholder="Write your blog post content here...&#10;&#10;You can use plain text to express your ideas. Share your knowledge, tell a story, or teach something new!" required></textarea>
        </div>

        <div class="form-group">
          <label>Tags</label>
          <div class="tag-input" id="tagInput">
            <input type="text" id="tagField" placeholder="Type a tag and press Enter...">
          </div>
          <small style="color: var(--gray); font-size: 0.8rem;">Press Enter or comma to add tags</small>
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-secondary" onclick="saveDraft()">💾 Save as Draft</button>
          <button type="submit" class="btn btn-primary" style="flex: 1;">🚀 Publish Post</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  
</body>
</html>
