<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Blog - BlogVerse</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="navbar-brand">
        <div class="logo-icon">✍</div>
        BlogVerse
      </a>

      <button class="hamburger" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <div class="nav-menu">
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="dashboard.html">Dashboard</a>
          <a href="create-blog.html" class="active">Create Post</a>
        </div>
        <div class="nav-auth">
          <!-- Updated by JS -->
        </div>
      </div>
    </div>
  </nav>

  <!-- Create Blog Form -->
  <div class="create-blog-wrapper">
    <div class="create-blog-card fade-in-up">
      <h2>✏️ Create New Post</h2>

      <form id="createBlogForm" novalidate>
        <div class="form-group">
          <label for="title">Post Title</label>
          <input type="text" id="title" placeholder="Enter an engaging title..." required>
        </div>

        <div class="form-group">
          <label>Cover Image</label>
          <div class="image-upload" id="imageUpload">
            <div class="upload-icon">📷</div>
            <p><strong>Click to upload</strong> or drag and drop</p>
            <p style="font-size: 0.85rem; margin-top: 5px;">SVG, PNG, JPG or GIF (max. 2MB)</p>
          </div>
          <input type="file" id="coverImage" accept="image/*" style="display: none;">
        </div>

        <div class="form-group">
          <label for="category">Category</label>
          <select id="category">
            <option value="">Select a category</option>
            <option value="Technology">Technology</option>
            <option value="Design">Design</option>
            <option value="Tutorial">Tutorial</option>
            <option value="Startup">Startup</option>
            <option value="AI & ML">AI & ML</option>
            <option value="Lifestyle">Lifestyle</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="content">Content</label>
          <textarea id="content" placeholder="Write your blog post content here...&#10;&#10;You can use plain text to express your ideas. Share your knowledge, tell a story, or teach something new!" required></textarea>
        </div>

        <div class="form-group">
          <label>Tags</label>
          <div class="tag-input" id="tagInput">
            <input type="text" id="tagField" placeholder="Type a tag and press Enter...">
          </div>
          <small style="color: var(--gray); font-size: 0.8rem;">Press Enter or comma to add tags</small>
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-secondary" onclick="saveDraft()">💾 Save as Draft</button>
          <button type="submit" class="btn btn-primary" style="flex: 1;">🚀 Publish Post</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    // Check auth
    const user = DB.getCurrentUser();
    if (!user) {
      window.location.href = 'login.html';
    }

    // Tags handling
    const tags = [];
    const tagInput = document.getElementById('tagInput');
    const tagField = document.getElementById('tagField');

    tagField.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ',') {
        e.preventDefault();
        const value = tagField.value.trim().replace(',', '');
        if (value && !tags.includes(value) && tags.length < 5) {
          tags.push(value);
          renderTags();
          tagField.value = '';
        }
      }
    });

    function renderTags() {
      const existingTags = tagInput.querySelectorAll('.tag');
      existingTags.forEach(t => t.remove());

      tags.forEach((tag, i) => {
        const span = document.createElement('span');
        span.className = 'tag';
        span.innerHTML = `${tag} <span class="remove-tag" onclick="removeTag(${i})">×</span>`;
        tagInput.insertBefore(span, tagField);
      });
    }

    function removeTag(index) {
      tags.splice(index, 1);
      renderTags();
    }

    // Image upload
    const imageUpload = document.getElementById('imageUpload');
    const coverImage = document.getElementById('coverImage');

    imageUpload.addEventListener('click', () => coverImage.click());

    coverImage.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        imageUpload.innerHTML = `
          <div class="upload-icon">✅</div>
          <p><strong>${file.name}</strong></p>
          <p style="font-size: 0.85rem; margin-top: 5px; color: var(--success);">Image selected! Click to change.</p>
        `;
      }
    });

    // Drag and drop
    imageUpload.addEventListener('dragover', (e) => {
      e.preventDefault();
      imageUpload.style.borderColor = 'var(--primary)';
      imageUpload.style.background = 'rgba(108, 92, 231, 0.05)';
    });

    imageUpload.addEventListener('dragleave', () => {
      imageUpload.style.borderColor = '';
      imageUpload.style.background = '';
    });

    imageUpload.addEventListener('drop', (e) => {
      e.preventDefault();
      imageUpload.style.borderColor = '';
      imageUpload.style.background = '';
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) {
        coverImage.files = e.dataTransfer.files;
        imageUpload.innerHTML = `
          <div class="upload-icon">✅</div>
          <p><strong>${file.name}</strong></p>
          <p style="font-size: 0.85rem; margin-top: 5px; color: var(--success);">Image selected! Click to change.</p>
        `;
      }
    });

    // Form Submission
    const form = document.getElementById('createBlogForm');

    function getFormData() {
      return {
        title: document.getElementById('title').value.trim(),
        category: document.getElementById('category').value,
        content: document.getElementById('content').value.trim(),
        tags: [...tags],
        author: user ? user.name : 'Anonymous',
        authorEmail: user ? user.email : ''
      };
    }

    function validateForm() {
      let valid = true;
      const title = document.getElementById('title');
      const content = document.getElementById('content');

      clearFieldError(title);
      clearFieldError(content);

      if (!title.value.trim()) {
        showFieldError(title, 'Title is required');
        valid = false;
      }

      if (!content.value.trim()) {
        showFieldError(content, 'Content is required');
        valid = false;
      } else if (content.value.trim().length < 50) {
        showFieldError(content, 'Content must be at least 50 characters');
        valid = false;
      }

      return valid;
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!validateForm()) return;

      const data = getFormData();
      data.status = 'published';
      DB.savePost(data);
      showToast('Blog post published successfully! 🎉', 'success');

      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 1200);
    });

    function saveDraft() {
      const title = document.getElementById('title');
      if (!title.value.trim()) {
        showFieldError(title, 'Title is required to save a draft');
        return;
      }
      clearFieldError(title);

      const data = getFormData();
      data.status = 'draft';
      data.content = data.content || 'Draft in progress...';
      DB.savePost(data);
      showToast('Draft saved! 💾', 'info');

      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 1000);
    }

    // Clear errors on input
    document.querySelectorAll('input, textarea, select').forEach(input => {
      input.addEventListener('input', () => clearFieldError(input));
    });
  </script>
</body>
</html>
