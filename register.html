<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - BlogVerse</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="navbar-brand">
        <div class="logo-icon">✍</div>
        BlogVerse
      </a>

      <button class="hamburger" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <div class="nav-menu">
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="index.html#featured">Blog</a>
          <a href="index.html#categories">Categories</a>
        </div>
        <div class="nav-auth">
          <a href="login.html" class="btn btn-sm btn-secondary">Log In</a>
          <a href="register.html" class="btn btn-sm btn-primary active">Sign Up</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Register Form -->
  <div class="auth-wrapper">
    <div class="auth-card fade-in-up">
      <div class="logo">
        <h2>Create Account 🚀</h2>
        <p>Join BlogVerse and start writing today</p>
      </div>

      <form id="registerForm" novalidate>
        <div class="form-group">
          <label for="fullname">Full Name</label>
          <input type="text" id="fullname" placeholder="John Doe" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Min 6 characters" required>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" placeholder="Re-enter your password" required>
        </div>

        <div class="form-options">
          <label>
            <input type="checkbox" id="terms" required> I agree to the <a href="#">Terms & Conditions</a>
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-lg">Create Account</button>
      </form>

      <div class="divider">or sign up with</div>

      <div class="social-btns">
        <button class="btn">🔵 Google</button>
        <button class="btn">⚫ GitHub</button>
      </div>

      <p class="auth-footer">
        Already have an account? <a href="login.html">Log in</a>
      </p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  
</body>
</html>
